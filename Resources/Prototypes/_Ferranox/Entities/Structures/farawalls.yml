- type: entity
  parent: BaseWall
  id: ConcreteWall
  name: Concrete Wall
  description: A wall made out of concrete, tested through time and reinforced with metal. #Add more here if the need is found.
  components:
  - type: Sprite
    sprite: _Ferranox\Structures\Walls\concretewalls.rsi
  - type: Icon
    sprite: _Ferranox\Structures\Walls\concretewalls.rsi
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: concretewall
